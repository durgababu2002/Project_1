spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/resilience_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:${REDIS_HOST:redis}}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:${REDIS_PORT:6379}}

server.port=8080

# --- Week 2: Real SLA Engine ---
# SLA validator cadence.
sla.validator.enabled=true
sla.validator.interval-ms=5000
# Reachable from inside the container (overridable via env in docker-compose).
locust.host=${LOCUST_HOST:http://localhost:8089}
target-api.url=${TARGET_API_URL:http://localhost:8081}
# External alert webhook (Slack/Teams/PagerDuty/n8n). Leave empty to disable.
sla.alert.webhook-url=${SLA_WEBHOOK_URL:}

# Actuator / Micrometer → Prometheus endpoint
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=control-plane

# Publish percentile histograms so Prometheus histogram_quantile works in Grafana.
# Without this, the http.server.requests Timer emits no "_bucket" series and
# p50/p95/p99 latency panels stay empty.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=10ms,50ms,100ms,200ms,500ms,1s,2s,5s
