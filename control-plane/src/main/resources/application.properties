spring.datasource.url=jdbc:postgresql://postgres:5432/resilience_db
spring.datasource.username=admin
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.data.redis.host=redis
spring.data.redis.port=6379

server.port=8080

# Actuator / Micrometer → Prometheus endpoint
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=control-plane

# Publish percentile histograms so Prometheus histogram_quantile works in Grafana.
# Without this, the http.server.requests Timer emits no "_bucket" series and
# p50/p95/p99 latency panels stay empty.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=10ms,50ms,100ms,200ms,500ms,1s,2s,5s
