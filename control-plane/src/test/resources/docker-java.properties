# Pins the Docker Engine API version for the docker-java client used by
# Testcontainers. Testcontainers' default wiring forces API 1.24/1.32, which
# modern Docker engines (API >= 1.40, e.g. Docker 20.10+ / Docker Desktop 4.x
# with an engine serving 1.55) reject with HTTP 400, so Testcontainers can
# never find a valid environment.
#
# 1.40 is the documented minimum API of current engines; it still works on the
# newest daemons (clients may use an older API than the server) and matches the
# oldest engines Testcontainers 1.21 still supports.
api.version=1.40