services:
  postgres:
    image: postgres:15-alpine
    container_name: resilience_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: resilience_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: resilience_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  target-api:
    build:
      context: ./target-api
    container_name: resilience_target
    ports:
      - "8081:8081"
    restart: unless-stopped

  control-plane:
    build:
      context: ./control-plane
    container_name: resilience_control
    environment:
      - LOCUST_HOST=http://load-generator:8089
      - TARGET_API_URL=http://target-api:8081
      - SLA_WEBHOOK_URL=${SLA_WEBHOOK_URL:-}
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  load-generator:
    build:
      context: ./load-generator
    container_name: resilience_locust
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PROM_PORT=9189
    ports:
      - "8089:8089"
    depends_on:
      - redis
      - target-api
    command: ["locust", "-f", "locustfile.py", "--host=http://target-api:8081"]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: resilience_prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - target-api
      - control-plane
      - load-generator
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.2
    container_name: resilience_grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
