server.port=8081
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=*

# Actuator / Micrometer → Prometheus endpoint
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=target-api

# Publish percentile histograms so Prometheus histogram_quantile works in Grafana.
# Without this, the http.server.requests Timer emits no "_bucket" series and
# p50/p95/p99 latency panels stay empty.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=10ms,50ms,100ms,200ms,500ms,1s,2s,5s
